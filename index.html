<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Không Quảng Cáo</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        input { width: 70%; padding: 10px; font-size: 16px; border: none; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; border: none; background: #ff0000; color: white; cursor: pointer; border-radius: 4px; }
        .video-container { margin-top: 20px; position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Xem YouTube Không Quảng Cáo</h2>
        <p>Dán link YouTube hoặc ID video vào đây:</p>
        <input type="text" id="videoUrl" placeholder="Ví dụ: https://youtube.com">
        <button onclick="loadVideo()">Xem Ngay</button>
        
        <div class="video-container" id="player">
            <!-- Video sẽ hiển thị ở đây -->
        </div>
    </div>

    <script>
        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url;
        }

        function loadVideo() {
            const input = document.getElementById('videoUrl').value.trim();
            if (!input) return alert('Vui lòng nhập link hoặc ID video!');
            
            const videoId = extractVideoId(input);
            const playerDiv = document.getElementById('player');
            
            // Sử dụng các server Invidious public để xem không quảng cáo
            const invidiousInstance = "https://nerdvpn.de"; 
            
            playerDiv.innerHTML = `<iframe src="${invidiousInstance}/embed/${videoId}" allowfullscreen></iframe>`;
        }
    </script>
</body>
</html>
