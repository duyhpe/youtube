<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Premium - Trang Chủ</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f0f0f;
            font-family: Arial, sans-serif;
        }
        /* Thanh công cụ tìm kiếm và điều hướng */
        .nav-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background: #212121;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 9999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #ff0000;
            text-decoration: none;
            cursor: pointer;
        }
        .search-box {
            display: flex;
            width: 50%;
            max-width: 600px;
        }
        .search-box input {
            flex-grow: 1;
            padding: 8px 12px;
            border: 1px solid #303030;
            background: #121212;
            color: white;
            border-radius: 2px 0 0 2px;
            font-size: 14px;
            outline: none;
        }
        .search-box button {
            padding: 8px 20px;
            border: none;
            background: #303030;
            color: white;
            border-radius: 0 2px 2px 0;
            cursor: pointer;
        }
        .search-box button:hover {
            background: #404040;
        }
        .download-btn {
            background: #00b0ff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .download-btn:hover {
            background: #0091ea;
        }
        /* Khung hiển thị nội dung chính */
        .content-frame {
            position: absolute;
            top: 56px;
            left: 0;
            width: 100%;
            height: calc(100% - 56px);
            border: none;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a class="logo" onclick="goHome()">📺 YT HOMEPAGE</a>
        
        <div class="search-box">
            <input type="text" id="inputUrl" placeholder="Dán link video YouTube vào đây để xem không quảng cáo...">
            <button onclick="playVideo()">XEM NGAY</button>
        </div>

        <button class="download-btn" onclick="downloadVideo()">📥 TẢI VIDEO</button>
    </div>

    <!-- Mở trang web sẽ nạp thẳng giao diện trang chủ không quảng cáo -->
    <iframe id="youtubeFrame" class="content-frame" src="https://yewtu.be" allowfullscreen></iframe>

    <script>
        // Tự động nhận diện khi nhấn phím Enter
        document.getElementById('inputUrl').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') playVideo();
        });

        // Hàm đưa trang quay trở lại trang chủ mặc định
        function goHome() {
            document.getElementById('inputUrl').value = "";
            document.getElementById('youtubeFrame').src = "https://yewtu.be";
        }

        // Bóc tách ID để phát video đơn lẻ khi người dùng dán link
        function parseId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            if (match && match.length === 11) {
                return match;
            }
            return url.trim().length === 11 ? url.trim() : null;
        }

        function playVideo() {
            const input = document.getElementById('inputUrl').value.trim();
            if (!input) return alert('Vui lòng nhập link video!');

            const id = parseId(input);
            if (!id) return alert('Đường link không hợp lệ!');

            // Chuyển sang luồng phát video không chứa dữ liệu quảng cáo
            document.getElementById('youtubeFrame').src = "https://youtube-nocookie.com" + id + "?autoplay=1&rel=0";
        }

        // Hàm xử lý tải file media
        function downloadVideo() {
            const frameSrc = document.getElementById('youtubeFrame').src;
            let videoId = "";

            if (frameSrc.includes("embed/")) {
                videoId = frameSrc.split("embed/")[1].split("?")[0];
            }

            if (!videoId) {
                return alert('Vui lòng dán link video vào thanh công cụ và bấm "XEM NGAY" trước khi bấm tải!');
            }

            const downloadUrl = "https://9xbuddy.xyz" + videoId;
            window.open(downloadUrl, '_blank');
        }
    </script>
</body>
</html>
