<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Sạch - Không Quảng Cáo</title>
    <style>
        :root { --bg-color: #0f0f0f; --card-bg: #1f1f1f; --text-color: #f1f1f1; --accent-color: #ff0000; }
        body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 15px 5%; background-color: #212121; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .logo { font-size: 22px; font-weight: bold; color: var(--accent-color); cursor: pointer; text-decoration: none; }
        .search-box { display: flex; flex-grow: 1; max-width: 500px; margin: 10px 20px; }
        .search-box input { flex-grow: 1; padding: 10px 15px; border: 1px solid #303030; background: #121212; color: white; border-radius: 20px 0 0 20px; font-size: 15px; outline: none; }
        .search-box button { padding: 10px 20px; border: none; background: #303030; color: white; border-radius: 0 20px 20px 0; cursor: pointer; }
        .search-box button:hover { background: #404040; }
        .main-layout { display: flex; flex-direction: column; padding: 20px 5%; max-width: 1300px; margin: auto; }
        .player-section { width: 100%; display: none; margin-bottom: 30px; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 12px; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .video-title { margin-top: 15px; font-size: 20px; font-weight: 600; }
        .grid-title { font-size: 20px; margin-bottom: 15px; font-weight: bold; border-left: 4px solid var(--accent-color); padding-left: 10px; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .video-card { background: var(--card-bg); border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; position: relative; }
        .video-card:hover { transform: translateY(-4px); }
        .video-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .video-info { padding: 12px; }
        .v-title { font-size: 14px; font-weight: bold; margin: 0 0 6px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
        .v-author { font-size: 12px; color: #aaa; margin: 0; }
        .loading { text-align: center; padding: 40px; font-size: 18px; color: #aaa; }
    </style>
</head>
<body>

    <header>
        <a class="logo" onclick="loadTrending()">📺 YT NO-ADS</a>
        <div class="search-box">
            <input type="text" id="searchInp" placeholder="Tìm kiếm video, tên kênh...">
            <button onclick="searchVideos()">🔍</button>
        </div>
    </header>

    <div class="main-layout">
        <!-- Khu vực phát video -->
        <section class="player-section" id="playerSection">
            <div class="video-container" id="videoWrapper"></div>
            <div class="video-title" id="currentTitle">Tiêu đề video</div>
        </section>

        <!-- Danh sách video -->
        <section>
            <div class="grid-title" id="sectionTitle">Xu Hướng (Trending)</div>
            <div id="loadingStatus" class="loading" style="display:none;">Đang tải dữ liệu...</div>
            <div class="video-grid" id="videoGrid"></div>
        </section>
    </div>

    <script>
        // Danh sách các cụm server dự phòng ổn định, không quảng cáo
        const pipedInstances = [
            "https://kavin.rocks",
            "https://piped.yt",
            "https://garudalinux.org",
            "https://leptons.xyz"
        ];
        let currentApi = pipedInstances[0];

        // Lấy luồng phát nhúng trực tiếp tránh bị chặn bởi nhà mạng hoặc máy chủ
        function getEmbedUrl(id) {
            return `https://piped.video{id}`;
        }

        // Tự động tải trang chủ lúc mở web
        window.onload = function() {
            loadTrending();
            document.getElementById('searchInp').addEventListener('keypress', function (e) {
                if (e.key === 'key' || e.keyCode === 13) searchVideos();
            });
        };

        // Hàm gọi dữ liệu từ API mã nguồn mở
        async function fetchAPI(endpoint) {
            document.getElementById('loadingStatus').style.display = 'block';
            document.getElementById('videoGrid').innerHTML = '';
            
            for (let base of pipedInstances) {
                try {
                    const response = await fetch(`${base}${endpoint}`);
                    if (!response.ok) throw new Error();
                    currentApi = base; 
                    document.getElementById('loadingStatus').style.display = 'none';
                    return await response.json();
                } catch (err) {
                    console.log(`Server ${base} bận, đang chuyển sang server tiếp theo...`);
                }
            }
            document.getElementById('loadingStatus').innerText = "Hệ thống đang bận hoặc bị chặn, vui lòng tải lại trang sau ít phút.";
            return null;
        }

        // Tải trang chủ - Video thịnh hành
        async function loadTrending() {
            document.getElementById('sectionTitle').innerText = "Xu Hướng (Trang Chủ YouTube)";
            const data = await fetchAPI("/trending?region=VN");
            if (data) renderGrid(data);
        }

        // Tìm kiếm video
        async function searchVideos() {
            const query = document.getElementById('searchInp').value.trim();
            if (!query) return;
            document.getElementById('sectionTitle').innerText = `Kết quả tìm kiếm: "${query}"`;
            
            const data = await fetchAPI(`/search?q=${encodeURIComponent(query)}&filter=videos`);
            if (data && data.items) renderGrid(data.items);
        }

        // Hiển thị danh sách video lên giao diện dạng thẻ
        function renderGrid(items) {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';
            
            items.forEach(item => {
                // Nhận diện ID từ cấu trúc API khác nhau
                const videoId = item.url ? item.url.split("v=")[1] : (item.id || "").replace("/watch?v=", "");
                if (!videoId) return;

                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => playVideo(videoId, item.title);

                card.innerHTML = `
                    <img src="${item.thumbnail || 'https://placeholder.com'}" alt="${item.title}">
                    <div class="video-info">
                        <p class="v-title">${item.title}</p>
                        <p class="v-author">${item.uploaderName || item.author || 'YouTube'}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Kích hoạt trình phát video sạch không quảng cáo
        function playVideo(id, title) {
            const playerSection = document.getElementById('playerSection');
            const wrapper = document.getElementById('videoWrapper');
            const titleElem = document.getElementById('currentTitle');

            titleElem.innerText = title;
            wrapper.innerHTML = `<iframe src="${getEmbedUrl(id)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            
            playerSection.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
